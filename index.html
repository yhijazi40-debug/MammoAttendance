const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const fmtDate=s=>{if(!s)return'';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`};
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const dayName=s=>DAYS[parse(s).getDay()];
const sundayOf=s=>{const d=parse(s);d.setDate(d.getDate()-d.getDay());return ymd(d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const dayDiff=(a,b)=>Math.round((parse(a)-parse(b))/86400000);
const clock=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const sidOf=(date,sec)=>`d${date.replace(/-/g,'')}s${sec}`;
const rand=()=>{const a=new Uint8Array(6);crypto.getRandomValues(a);return [...a].map(x=>(x%36).toString(36)).join('')};
const PERIOD=60;
function themeLabel(){let t='auto';try{t=localStorage.getItem('theme')||'auto'}catch(e){}return t==='light'?'الوضع: فاتح':t==='dark'?'الوضع: داكن':'الوضع: تلقائي'}
function cycleTheme(){let t='auto';try{t=localStorage.getItem('theme')||'auto'}catch(e){}const n=t==='auto'?'light':t==='light'?'dark':'auto';
  try{localStorage.setItem('theme',n)}catch(e){}
  if(n==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',n);
  document.querySelectorAll('.theme[data-act=theme]').forEach(b=>b.textContent=themeLabel())}
const dayFromTxt=t=>{t=String(t||'').trim();const m={'حد':0,'احد':0,'أحد':0,'الأحد':0,'ن':1,'اثنين':1,'إثنين':1,'الاثنين':1,'الإثنين':1,'ثل':2,'ث':2,'ثلاثاء':2,'الثلاثاء':2,'ر':3,'اربعاء':3,'أربعاء':3,'الأربعاء':3,'خ':4,'خميس':4,'الخميس':4};return m[t]!=null?m[t]:null};
const emptyCourse=()=>({code:'',name:'',term:'الفصل الأول 2026-2027',termStart:'2026-10-11',lectureWeeks:15,totalWeeks:17,absLimit:20,off:[{n:1,day:2},{n:2,day:4}],mam:[{n:1,room:'',day:2},{n:2,room:'',day:4}],exams:[],admins:[],adminsTxt:''});

/* ---------- state ---------- */

const COURSE_TRASH=new Map();
let CC=null;                       // current course
const STU=new Map();               // id -> {id,name,off,mam,oi,mi}
const S={sessions:{},records:{},trash:{sessions:{},records:{},students:new Map()}};
let USER=null,IS_OWNER=false,IS_GLOBAL=false,ADMINS=[],LEGACY=false;
let watched={sid:null,unsub:null,list:[]};
const chains={},timers={};
const V={sub:'crs',termOpen:false,tab:'rec',cid:null,date:today(),custom:false,sec:1,sid:null,q:'',addq:'',onlyAbs:false,offSec:1,offWeek:1,confirmDel:false,copy:null,mq:'',mdiff:false,mdel:null,lq:'',lid:null,cf:null,cdel:null};
const hashM=/^#c-([a-z0-9]+)-(d\d{8}s\d+)-([a-z0-9]+)$/.exec(location.hash||'');
const isStudent=!!hashM;
const students=()=>[...STU.values()];
const cur=()=>V.sid?{s:S.sessions[V.sid],r:S.records[V.sid]}:null;
const room=n=>{const m=CC&&CC.mam.find(x=>x.n===n);return m&&m.room?m.room:''};
const mamLabel=n=>room(n)?`${n} · ${room(n)}`:String(n);
const offLabel=n=>{const o=CC&&CC.off.find(x=>x.n===n);return o&&o.day!=null?`${n} · ${DAYS[o.day]}`:String(n)};

/* ---------- term/calendar ---------- */
const weekNo=d=>Math.floor(dayDiff(d,CC.termStart)/7)+1;
const weekStart=n=>addDays(CC.termStart,(n-1)*7);
const examOf=n=>{const s=weekStart(n),e=addDays(s,6);const x=(CC.exams||[]).find(x=>x.from<=e&&x.to>=s);return x?x.label:''};
function termStats(){const t=today();const w=weekNo(t);let E=0;for(let k=1;k<=CC.lectureWeeks;k++)if(addDays(weekStart(k),6)<=t)E++;
  const c=(w>=1&&w<=CC.lectureWeeks&&E<w)?w:null;return{w,E,cur:c,R:Math.max(0,CC.lectureWeeks-E-(c?1:0))}}
function lectureDates(sec){const m=CC.mam.find(x=>x.n===sec);const off=m&&m.day!=null?m.day:0;return Array.from({length:CC.lectureWeeks},(_,i)=>addDays(weekStart(i+1),off))}
function defaultDate(sec){const l=lectureDates(sec),t=today();let d=l[0];for(const x of l)if(x<=t)d=x;return d}

/* ---------- firestore paths ---------- */
const cref=(...p)=>doc(db,'courses',CC.id,...p);
const ccol=n=>collection(db,'courses',CC.id,n);
const DAY30=30*86400000;
function queue(key,fn){chains[key]=(chains[key]||Promise.resolve()).then(fn).catch(e=>{console.error(e);toast('تعذّر الحفظ: تحقق من الاتصال والصلاحيات')});return chains[key]}
const saveSession=sid=>queue('s'+sid,()=>{const s=S.sessions[sid]||S.trash.sessions[sid];return setDoc(cref('sessions',sid),{date:s.date,sec:s.sec,status:s.status,openedAt:s.openedAt||Date.now(),courseName:CC.name,courseCode:CC.code,room:room(s.sec),deletedAt:s.deletedAt||null,origSid:s.origSid||null})});
const saveRecord=sid=>queue('r'+sid,()=>{const r=S.records[sid]||S.trash.records[sid];return setDoc(cref('records',sid),{date:r.date,sec:r.sec,draft:r.draft,src:r.src||{},times:r.times||{},final:r.final||null,committedAt:r.committedAt||null,history:r.history||[]})});
const saveRecordSoon=sid=>{clearTimeout(timers[sid]);timers[sid]=setTimeout(()=>saveRecord(sid),500)};
const saveStudent=s=>queue('t'+s.id,()=>setDoc(cref('students',String(s.id)),{name:s.name,off:s.off,mam:s.mam,oi:s.oi,mi:s.mi,deletedAt:s.deletedAt||null}));
const courseData=c=>({code:c.code,name:c.name,term:c.term,termStart:c.termStart,lectureWeeks:c.lectureWeeks,totalWeeks:c.totalWeeks,absLimit:c.absLimit,off:c.off,mam:c.mam,exams:c.exams||[],admins:c.admins||[],deletedAt:c.deletedAt||null});
const saveCourse=c=>queue('c'+c.id,()=>setDoc(doc(db,'courses',c.id),courseData(c)));
async function purgeSession(sid){
  try{const l=await getDocs(query(ccol('checkins'),where('sid','==',sid)));for(const d of l.docs)await deleteDoc(d.ref||cref('checkins',d.id));
    await deleteDoc(cref('sessions',sid));await deleteDoc(cref('records',sid));await deleteDoc(cref('tokens',sid)).catch(()=>{})}catch(e){console.error(e)}
}
async function purgeCourse(id){try{for(const n of['students','sessions','records','tokens','checkins'])await wipe('courses',id,n);await deleteDoc(doc(db,'courses',id))}catch(e){console.error(e)}}
async function loadAll(){
  const em=USER&&USER.email?USER.email.toLowerCase():'';
  let cs;
  try{cs=await getDocs(collection(db,'courses'));IS_GLOBAL=true}
  catch(e){IS_GLOBAL=false;cs=await getDocs(query(collection(db,'courses'),where('admins','array-contains',em)))}
  COURSES.clear();COURSE_TRASH.clear();
  cs.forEach(d=>{const c={id:d.id,...d.data()};if(c.deletedAt){if(Date.now()-c.deletedAt>DAY30)purgeCourse(c.id);else COURSE_TRASH.set(c.id,c)}else COURSES.set(c.id,c)});
  ADMINS=[];if(IS_OWNER){try{const a=await getDoc(doc(db,'config','admins'));ADMINS=a.exists()?(a.data().emails||[]):[]}catch(e){}}
  LEGACY=false;if(IS_GLOBAL){try{const l=await getDocs(collection(db,'roster'));LEGACY=l.size>0}catch(e){}}
  let id=V.cid;try{id=id||localStorage.getItem('cid')}catch(e){}
  if(!COURSES.has(id))id=COURSES.size?[...COURSES.keys()][0]:null;
  await selectCourse(id);
}
async function selectCourse(id){
  stopLive();watchCheckins(null);
  V.cid=id;V.sid=null;V.q='';V.lid=null;V.lq='';idxDirty=true;
  STU.clear();S.sessions={};S.records={};S.trash={sessions:{},records:{},students:new Map()};CC=id?COURSES.get(id):null;
  if(!CC)return;
  try{localStorage.setItem('cid',id)}catch(e){}
  const [r,s,c]=await Promise.all([getDocs(ccol('students')),getDocs(ccol('sessions')),getDocs(ccol('records'))]);
  r.forEach(d=>{const x=d.data();const st={id:+d.id,name:x.name,off:x.off,mam:x.mam,oi:x.oi||0,mi:x.mi||0,deletedAt:x.deletedAt||null};
    if(st.deletedAt){if(Date.now()-st.deletedAt>DAY30)deleteDoc(cref('students',d.id)).catch(()=>{});else S.trash.students.set(st.id,st)}else STU.set(st.id,st)});
  s.forEach(d=>{const x=d.data();if(x.deletedAt){if(Date.now()-x.deletedAt>DAY30)purgeSession(d.id);else S.trash.sessions[d.id]=x}else S.sessions[d.id]=x});
  c.forEach(d=>{const x=d.data();x.history=x.history||[];x.times=x.times||{};x.src=x.src||{};
    if(d.id in S.trash.sessions)S.trash.records[d.id]=x;else if(d.id in S.sessions)S.records[d.id]=x});
  V.sec=CC.mam.length?CC.mam[0].n:1;V.offSec=CC.off.length?CC.off[0].n:1;V.custom=false;
  V.date=defaultDate(V.sec);
  const dn=doneBuckets();V.offWeek=dn.length?weekNo(dn[dn.length-1]):Math.max(1,Math.min(CC.lectureWeeks,weekNo(today())));
  idxDirty=true;
}
function watchCheckins(sid){
  if(watched.sid===sid)return;
  if(watched.unsub)watched.unsub();
  watched={sid,unsub:null,list:[]};
  if(!sid)return;
  watched.unsub=onSnapshot(query(ccol('checkins'),where('sid','==',sid)),q=>{
    watched.list=q.docs.map(d=>{const x=d.data();return{id:+x.id,t:x.t&&x.t.toMillis?x.t.toMillis():Date.now()}});
    if(!isStudent&&V.tab==='rec'&&cur()&&cur().s&&cur().s.status==='open')updateLive();
  },e=>console.error(e));
}
async function wipe(...path){const q=await getDocs(collection(db,...path));let b=writeBatch(db),n=0;
  for(const d of q.docs){b.delete(d.ref||doc(db,...path,d.id));if(++n%400===0){await b.commit();b=writeBatch(db)}}await b.commit()}

/* ---------- attendance logic ---------- */
let idxCache=null,idxDirty=true;
function idx(){
  if(!idxDirty&&idxCache)return idxCache;
  const m=new Map();
  for(const r of Object.values(S.records)){if(!r.final)continue;const b=sundayOf(r.date);if(!m.has(b))m.set(b,[]);m.get(b).push(r.final)}
  idxCache=m;idxDirty=false;return m;
}
function status(b,id){const arr=idx().get(b);if(!arr)return;let res;for(const f of arr){if(id in f){if(f[id]==='P')return'P';res='A'}}return res}
const doneBuckets=()=>[...idx().keys()].sort();
function stat(id){let a=0,t=0;for(const b of idx().keys()){const st=status(b,id);if(st){t++;if(st==='A')a++}}return{a,t,pct:a/CC.lectureWeeks*100}}
function sessionRows(sec,draft){
  const ids=new Set(students().filter(s=>s.mam===sec).map(s=>s.id));
  Object.keys(draft||{}).forEach(k=>ids.add(+k));
  return [...ids].map(i=>STU.get(i)).filter(Boolean).sort((a,b)=>(a.mam===sec?0:1)-(b.mam===sec?0:1)||a.mi-b.mi||a.id-b.id);
}
const isDirty=r=>!r.final||JSON.stringify(r.draft)!==JSON.stringify(r.final);
const stateText=r=>!r.final?'مسودة: لم يُرحَّل الحضور إلى السجل بعد':isDirty(r)?'يوجد تعديلات غير مرحّلة':`تم الترحيل ${clock(r.committedAt)}`;
const srcTxt=s=>s==='qr'?'رمز QR':s==='m'?'يدوي':'';

/* ---------- session actions ---------- */
let live={sid:null,tokens:[],cur:null,last:0,busy:false,qr:null,tick:null};
async function ensureSession(status){
  const sid=sidOf(V.date,V.sec);
  if(S.sessions[sid]){V.sid=sid;V.q='';watchCheckins(sid);if(status==='open'&&S.sessions[sid].status!=='open'){return reopenQR()}return renderAll()}
  S.sessions[sid]={date:V.date,sec:V.sec,status,openedAt:Date.now()};
  const draft={};
  if(status==='closed')students().filter(s=>s.mam===V.sec).forEach(s=>draft[s.id]='A');
  S.records[sid]={date:V.date,sec:V.sec,draft,src:{},times:{},final:null,committedAt:null};
  V.sid=sid;V.q='';watchCheckins(sid);renderAll();
  await saveSession(sid);await saveRecord(sid);
}
async function closeQR(){
  const {s,r}=cur();
  if(!Object.keys(r.draft).length)students().filter(x=>x.mam===s.sec).forEach(x=>r.draft[x.id]='A');
  r.times=r.times||{};
  watched.list.forEach(c=>{r.times[c.id]=c.t;if(r.src[c.id]!=='m'){r.draft[c.id]='P';r.src[c.id]='qr'}});
  s.status='closed';stopLive();renderAll();
  await queue('tok'+V.sid,()=>setDoc(cref('tokens',V.sid),{valid:[],exp:0}));
  await saveSession(V.sid);await saveRecord(V.sid);
}
async function reopenQR(){const {s}=cur();s.status='open';renderAll();await saveSession(V.sid)}
async function commit(){const {r}=cur();r.final={...r.draft};r.committedAt=Date.now();r.history=[...(r.history||[]),{at:r.committedAt,by:USER&&USER.email?USER.email:'',final:{...r.final}}].slice(-15);idxDirty=true;V.offWeek=Math.min(Math.max(1,weekNo(r.date)),CC.lectureWeeks);renderAll();toast('تم ترحيل الحضور');await saveRecord(V.sid)}
async function removeSession(){
  const sid=V.sid;const {s,r}=cur();stopLive();
  /* ادمج ما سجّله الطلاب في المسودة قبل النقل حتى لا يضيع */
  (watched.sid===sid?watched.list:[]).forEach(c=>{if(r.src[c.id]!=='m'){r.draft[c.id]='P';r.src[c.id]='qr';(r.times=r.times||{})[c.id]=c.t}});
  watchCheckins(null);
  /* للسلة رقم فريد، فلا تُستبدل لو أُنشئت جلسة جديدة بنفس التاريخ لاحقاً */
  const tid=sid+'x'+Date.now().toString(36);
  S.trash.sessions[tid]={...s,deletedAt:Date.now(),status:'closed',origSid:sid};
  S.trash.records[tid]={...r};
  delete S.sessions[sid];delete S.records[sid];
  V.sid=null;V.confirmDel=false;idxDirty=true;renderAll();toast('نُقلت الجلسة إلى سلة المحذوفات (30 يوماً)');
  try{
    await saveSession(tid);await saveRecord(tid);
    const l=await getDocs(query(ccol('checkins'),where('sid','==',sid)));for(const d of l.docs)await deleteDoc(d.ref||cref('checkins',d.id));
    await deleteDoc(cref('sessions',sid));await deleteDoc(cref('records',sid));
    await queue('tok'+sid,()=>setDoc(cref('tokens',sid),{valid:[],exp:0}));
  }catch(e){console.error(e);toast('تعذّر حفظ السلة، تحقق من الاتصال')}
}
function setMark(id,absent){const {r}=cur();r.draft[id]=absent?'A':'P';r.src[id]='m';saveRecordSoon(V.sid)}
function addVisitor(id){const {r}=cur();r.draft[id]='P';r.src[id]='m';V.addq='';saveRecordSoon(V.sid);renderAll()}

/* ---------- live QR ---------- */
async function rotate(){
  if(live.busy)return;live.busy=true;
  const t=rand();const next=[...live.tokens,t].slice(-3);
  try{await setDoc(cref('tokens',live.sid),{valid:next,exp:Date.now()+6*60000});live.tokens=next;live.cur=t;live.last=Date.now();drawQR()}
  catch(e){console.error(e);toast('تعذّر تحديث الرمز')}
  live.busy=false;
}
const baseUrl=()=>location.origin+location.pathname;
function drawQR(){
  const box=$('#qrbox');if(!box||!live.cur)return;
  const url=baseUrl()+'#c-'+CC.id+'-'+live.sid+'-'+live.cur;
  if(typeof QRCode!=='undefined'){if(!live.qr||!box.firstChild||box.firstChild.tagName==='SPAN'){box.innerHTML='';live.qr=new QRCode(box,{text:url,width:280,height:280,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}else live.qr.makeCode(url)}
  else box.innerHTML='<span class="small muted" dir="ltr" style="word-break:break-all">'+esc(url)+'</span>';
}
function startLive(){
  stopLive();live={sid:V.sid,tokens:[],cur:null,last:0,busy:false,qr:null,tick:null};
  rotate();
  live.tick=setInterval(()=>{
    if(!live.cur)return;
    const left=Math.max(0,PERIOD-Math.floor((Date.now()-live.last)/1000));
    const a=$('#tleft'),b=$('#tbar');if(a)a.textContent=left;if(b)b.style.width=(left/PERIOD*100)+'%';
    if(Date.now()-live.last>=PERIOD*1000)rotate();
  },1000);
  updateLive();
}
function stopLive(){if(live.tick)clearInterval(live.tick);live={sid:null,tokens:[],cur:null,last:0,busy:false,qr:null,tick:null}}
function updateLive(){
  const f=$('#feed');if(!f)return;const c=cur();if(!c)return;
  const list=[...watched.list].sort((a,b)=>b.t-a.t);$('#ccount').textContent=list.length;
  f.innerHTML=list.slice(0,40).map(x=>{const s=STU.get(x.id);return `<li><span>${esc(s?s.name:x.id)} ${s&&s.mam!==c.s.sec?`<span class="pill warn">من مجموعة ${s.mam}</span>`:''}</span><span class="muted small">${clock(x.t)}</span></li>`}).join('')||'<li class="muted small">بانتظار أول تسجيل...</li>';
}

/* ---------- views: recording ---------- */
function chipsHtml(){
  const arr=Object.entries(S.sessions).sort((a,b)=>b[1].date.localeCompare(a[1].date)||a[1].sec-b[1].sec);
  if(!arr.length)return'<span class="muted small">لا توجد جلسات بعد لهذا المساق.</span>';
  return arr.map(([sid,s])=>{const r=S.records[sid]||{};const cls=s.status==='open'?'open':r.final&&!isDirty(r)?'done':'draft';
    return `<button class="chip" data-act="pick" data-sid="${sid}" aria-pressed="${V.sid===sid}"><i class="dot ${cls}"></i>${dayName(s.date)} ${fmtDate(s.date).slice(0,5)} · ${mamLabel(s.sec)} · أ${weekNo(s.date)}</button>`}).join('');
}
function termHtml(){
  const ts=termStats();const done=new Set(doneBuckets());
  const cells=Array.from({length:CC.lectureWeeks},(_,i)=>i+1).map(k=>{const st=weekStart(k);const ex=examOf(k);const past=addDays(st,6)<=today();
    const has=Object.values(S.sessions).some(s=>weekNo(s.date)===k);
    const cls=['wk',past?'past':'',ts.cur===k?'cur':'',ex?'ex':''].join(' ');
    return `<button class="${cls}" data-act="wk" data-w="${k}" title="${ex?ex+' · ':''}${fmtDate(st)}"><b>${k}</b><span>${fmtDate(st).slice(0,5)}</span><span class="ck">${done.has(st)?'✓':has?'•':'&nbsp;'}</span></button>`}).join('');
  const lim=Math.floor(CC.lectureWeeks*CC.absLimit/100);
  return `<details class="card" id="terms" ${V.termOpen?'open':''}><summary><span>خريطة الأسابيع</span>
   <span class="small muted" style="font-weight:400">${ts.w>=1&&ts.w<=CC.totalWeeks?'اليوم في الأسبوع '+ts.w:ts.w<1?'لم يبدأ التدريس':'انتهت أسابيع الفصل'} · مضى ${ts.E} من ${CC.lectureWeeks}${ts.cur?' · الحالي '+ts.cur:''} · المتبقي ${ts.R}</span></summary>
   <div class="col"><div class="weeks">${cells}</div>
   <div class="legend small muted"><span>✓ مرحّل</span><span>• مسودة أو مفتوح</span><span><i class="dot" style="background:var(--warn)"></i>أسبوع فيه امتحانات</span><span>الحد الأقصى للغياب ${lim} من ${CC.lectureWeeks} (${CC.absLimit}%)</span></div></div></details>`;
}

    return `<option value="${d}" ${d===V.date&&!V.custom?'selected':''}>الأسبوع ${i+1} · ${dayName(d)} ${fmtDate(d).slice(0,5)}${mark}</option>`}).join('');

    ${!inList?`<div class="field"><label for="f-date">اختر التاريخ</label><input id="f-date" type="date" value="${V.date}" data-f="date"></div>`:''}

    ${ex?'':'<button class="btn ghost" data-act="startman">تسجيل يدوي بدون رمز</button>'}

/* ---------- import (university xlsx) ---------- */
function parseUniSheet(ws){
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  const meta={};let hdr=-1;
  for(let i=0;i<aoa.length&&hdr<0;i++){const r=aoa[i];const k=String(r[0]==null?'':r[0]).trim();
    if(k==='الشعبة')meta.sec=Number(r[2]);else if(k==='القاعة')meta.room=r[2];else if(k==='الأيام')meta.day=r[2];
    if(String(r[1]==null?'':r[1]).includes('الرقم الجامعي'))hdr=i}
  const rows=[];if(hdr>=0)for(let i=hdr+1;i<aoa.length;i++){const r=aoa[i];const id=Number(r[1]);if(Number.isInteger(id)&&id>0&&r[2])rows.push({id,name:String(r[2]).trim()})}
  return{meta,rows};
}
async function importFiles(files,kind){
  await loadLibs();
  if(typeof XLSX==='undefined')return toast('مكتبة Excel لم تُحمَّل. تحقق من الاتصال');
  let added=0,updated=0,sheets=0;const warn=[];
  for(const f of files){
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    for(const name of wb.SheetNames){
      const {meta,rows}=parseUniSheet(wb.Sheets[name]);
      if(!rows.length)continue;
      if(!Number.isInteger(meta.sec)||meta.sec<1){warn.push(`ورقة «${name}» بدون رقم شعبة`);continue}
      sheets++;const n=meta.sec;const day=dayFromTxt(meta.day);
      if(kind==='off'){if(!CC.off.find(x=>x.n===n))CC.off.push({n,day:day==null?2:day})}
      else{if(!CC.mam.find(x=>x.n===n))CC.mam.push({n,room:meta.room||'',day:day==null?0:day})}
      rows.forEach((r,i)=>{
        let s=STU.get(r.id);
        if(!s){s={id:r.id,name:r.name,off:n,mam:n,oi:i+1,mi:i+1};STU.set(r.id,s);added++}
        else{updated++;s.name=s.name||r.name}
        if(kind==='off'){s.off=n;s.oi=i+1}else{s.mam=n;s.mi=i+1}
        if(kind==='mam'&&!CC.off.find(x=>x.n===s.off)){CC.off.push({n:s.off,day:2})}
      });
    }
  }
  if(!sheets)return toast(warn[0]||'لم أجد قوائم طلاب في الملف');
  if(IS_GLOBAL){await saveCourse(CC);COURSES.set(CC.id,CC)}
  try{let b=writeBatch(db),k=0;for(const s of students()){b.set(cref('students',String(s.id)),{name:s.name,off:s.off,mam:s.mam,oi:s.oi,mi:s.mi});if(++k%400===0){await b.commit();b=writeBatch(db)}}await b.commit()}
  catch(e){console.error(e);return toast('تعذّر حفظ القوائم')}
  toast(`تم: ${added} طالب جديد، ${updated} محدّث${warn.length?' · '+warn.join('، '):''}`);renderAll();
}

function downloadCSV(name,aoa){
  const csv='﻿'+aoa.map(r=>r.map(c=>{c=c==null?'':String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
async function downloadXLSX(name,sheets){
  await loadLibs();
  if(typeof XLSX==='undefined')return toast('مكتبة Excel لم تُحمَّل. جرّب تنزيل CSV');
  const wb=XLSX.utils.book_new();
  sheets.forEach(([n,aoa,w])=>{const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=(w||aoa[0].map(()=>16)).map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,n.slice(0,31))});
  wb.Workbook={Views:[{RTL:true}]};XLSX.writeFile(wb,name);
}

    let b=writeBatch(db),n=0;const add=(ref,d)=>{b.set(ref,d);return(++n%400===0)?b.commit().then(()=>{b=writeBatch(db)}):null};

function fullReport(){

  const log=[];
  sess.forEach(([sid,r])=>{sessionRows(r.sec,r.draft).forEach(x=>{log.push([fmtDate(r.date),dayName(r.date),weekNo(r.date),r.sec,room(r.sec),x.id,x.name,x.off,x.mam,r.draft[x.id]==='A'?'غائب':'حاضر',srcTxt((r.src||{})[x.id]),(r.times||{})[x.id]?clock(r.times[x.id]):'',x.mam!==r.sec?'نعم':'',r.final?'مرحّل':'مسودة'])})});
  const mh=['الرقم الجامعي','الاسم','الشعبة الرسمية','مجموعة القاعة',...sess.map(([,r])=>`${fmtDate(r.date).slice(0,5)} م${r.sec}`)];

const ST={step:'load',msg:'',who:null,sess:null,loadedAt:Date.now()};

async function initStudent(){
  await sdkP;ST.loadedAt=ST.loadedAt||Date.now();

  else if(ST.sess.status!=='open')ST.step='bad',ST.msg='تم إغلاق تسجيل الحضور لهذه المحاضرة. راجع المدرّس.';
  renderStudent();
}
function renderStudent(){
  const s=ST.sess;const keep=$('#sid-in')?$('#sid-in').value:'';
  const head=`<div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="eyebrow">${s?esc(s.courseCode||''):'نظام حضور المساقات'}</div><h1>${s?'حضور مساق '+esc(s.courseName||''):'حضور المساق'}</h1>${s?`<div class="small muted">${dayName(s.date)} ${fmtDate(s.date)}${s.room?' · '+esc(s.room):''}</div>`:''}</div><button class="theme" data-act="theme">${themeLabel()}</button></div>`;
  let body='';
  if(ST.step==='load')body='<p class="muted">جارٍ التحقق من الرمز...</p>';
  else if(ST.step==='bad')body=`<div class="err">${esc(ST.msg)}</div>`;
  else if(ST.step==='id')body=`<div class="field"><label for="sid-in">الرقم الجامعي</label><input class="id" id="sid-in" type="text" inputmode="numeric" autocomplete="off" placeholder="1xxxxx" maxlength="8"></div>${ST.msg?`<div class="err">${esc(ST.msg)}</div>`:''}<button class="btn primary" data-act="lookup">متابعة</button>`;
  else if(ST.step==='confirm')body=`<div class="center"><div class="muted small">هل هذا أنت؟</div><h2 style="font-size:20px;margin-top:4px">${esc(ST.who.name)}</h2><div class="muted" dir="ltr">${ST.who.id}</div></div>${ST.msg?`<div class="err">${esc(ST.msg)}</div>`:''}<button class="btn primary" data-act="confirm">نعم، سجّل حضوري</button><button class="btn ghost" data-act="back">ليس أنا</button>`;
  else if(ST.step==='done')body=`<div class="ok">✓</div><div class="center"><h2>تم تسجيل حضورك</h2><div class="muted small" style="margin-top:4px">${esc(ST.who.name)}</div></div>`;
  $('#app').innerHTML=`<div class="stu">${head}<section class="card">${body}</section><p class="small muted center">الغياب يُحتسب حسب شعبتك الرسمية في النظام، وليس حسب القاعة.</p></div>`;
  const i=$('#sid-in');if(i){if(keep)i.value=keep;i.focus()}
}
async function stuLookup(){
  await sdkP;
  const v=($('#sid-in').value||'').replace(/\D/g,'');
  if(!v){ST.msg='اكتب رقمك الجامعي.';return renderStudent()}
  try{const d=await getDoc(sref('students',v));
    if(!d.exists()||d.data().deletedAt){ST.msg='هذا الرقم غير موجود في قائمة المساق.';return renderStudent()}
    ST.who={id:v,name:d.data().name};ST.msg='';ST.step='confirm';renderStudent();
  }catch(e){ST.msg='تعذّر الاتصال. حاول مرة أخرى.';renderStudent()}
}
async function stuConfirm(){
  await sdkP;
  const sid=hashM[2],tok=hashM[3];
  if(Date.now()-ST.loadedAt>5*60*1000){ST.step='bad';ST.msg='انتهت مهلة الصفحة. امسح الرمز مرة أخرى.';return renderStudent()}
  const k='dev_'+hashM[1]+'_'+sid;let prev=null;try{prev=localStorage.getItem(k)}catch(e){}
  if(prev&&prev!==ST.who.id){ST.msg='سُجّل حضور طالب آخر من هذا الجهاز لهذه المحاضرة.';return renderStudent()}
  try{
    await setDoc(sref('checkins',sid+'_'+ST.who.id),{sid,id:ST.who.id,t:serverTimestamp(),token:tok});
    try{localStorage.setItem(k,ST.who.id)}catch(e){}

  }catch(e){
    let closed=false;try{const d=await getDoc(sref('sessions',sid));closed=!d.exists()||d.data().status!=='open'}catch(_){}
    ST.msg=closed?'تم إغلاق تسجيل الحضور لهذه المحاضرة.':'لم يُقبل التسجيل: إما انتهت صلاحية الرمز (امسح الرمز الحالي من الشاشة) أو أن هذا الرقم مسجّل مسبقاً.';
    renderStudent();
  }
}

   case'lookup':stuLookup();break;
   case'back':ST.step='id';ST.msg='';renderStudent();break;
   case'confirm':stuConfirm();break;
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.act==='tg'){setMark(+t.dataset.id,t.checked);refreshRows();return}
  if(t.dataset.cf){const k=t.dataset.cf;V.cf[k]=t.type==='number'?+t.value:t.value;return}
  if(t.dataset.ca){const g=V.cf[t.dataset.ca][+t.dataset.i];const k=t.dataset.k;g[k]=(t.type==='number'||k==='day')?+t.value:t.value;return}
  const f=t.dataset.f;if(!f)return;
  if(f==='course'){await selectCourse(t.value);renderAll()}
  else if(f==='sec'){V.sec=+t.value;V.custom=false;V.date=defaultDate(V.sec);renderAll()}
  else if(f==='dsel'){if(t.value==='custom'){V.custom=true}else{V.custom=false;V.date=t.value}renderAll()}
  else if(f==='date'){V.date=t.value||today();V.custom=true;renderAll()}
  else if(f==='offSec'){V.offSec=+t.value;renderAll()}
  else if(f==='offWeek'){V.offWeek=+t.value;renderAll()}
  else if(f==='onlyAbs'){V.onlyAbs=t.checked;renderAll()}
  else if(f==='mdiff'){V.mdiff=t.checked;renderAll()}
  else if(f==='mname'){const s=STU.get(+t.dataset.id);s.name=t.value.trim()||s.name;saveStudent(s);toast('تم الحفظ')}
  else if(f==='moff'||f==='mmam'){const s=STU.get(+t.dataset.id);const v=+t.value;const all=students();
    if(f==='moff'){s.off=v;s.oi=Math.max(0,...all.filter(x=>x.off===v&&x!==s).map(x=>x.oi))+1}
    else{s.mam=v;s.mi=Math.max(0,...all.filter(x=>x.mam===v&&x!==s).map(x=>x.mi))+1}
    saveStudent(s);toast('تم نقل الطالب');renderAll()}
  else if(f==='hist'){if(t.value==='')return;const c=cur();const h=c.r.history[+t.value];c.r.draft={...h.final};saveRecordSoon(V.sid);refreshRows();t.value='';toast('حُمّلت النسخة كمسودة. اضغط «ترحيل التعديلات» لتثبيتها')}
  else if(f==='restore'){const file=t.files[0];if(file)await restoreBackup(file);t.value=''}
  else if(f==='import'){const files=[...t.files];if(!files.length)return;const kind=$('#i-kind').value;
    try{await importFiles(files,kind)}catch(err){console.error(err);toast('تعذّر قراءة الملف')}t.value=''}
});
document.addEventListener('input',e=>{
  const f=e.target.dataset.f;
  if(f==='q'){V.q=e.target.value;refreshRows()}
  else if(f==='mq'){V.mq=e.target.value;renderAll()}
  else if(f==='lq'){V.lq=e.target.value;V.lid=null;renderAll()}
  else if(f==='addq'){V.addq=e.target.value;const c=cur();const q=V.addq.trim();const box=$('#res');
    const res=q?students().filter(x=>!(x.id in c.r.draft)&&(x.name.includes(q)||String(x.id).includes(q))).slice(0,8):[];
    box.hidden=!res.length;box.innerHTML=res.map(x=>`<button data-act="addv" data-id="${x.id}"><span>${esc(x.name)}</span><span class="muted">${x.id} · مجموعة ${x.mam}</span></button>`).join('')}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='sid-in')stuLookup()});
document.addEventListener('toggle',e=>{if(e.target.id==='terms')V.termOpen=e.target.open},true);
document.addEventListener('submit',async e=>{
  if(e.target.id!=='login')return;e.preventDefault();
  const mail=$('#l-mail').value.trim(),pass=$('#l-pass').value;
  try{await sdkP;await signInWithEmailAndPassword(auth,mail,pass)}
  catch(err){renderLogin('تعذّر تسجيل الدخول. تحقق من البريد وكلمة المرور.')}
});

/* ---------- idle logout ---------- */
const IDLE_MS=10*60*1000;let lastAct=Date.now(),idleTimer=null,loginMsg='';
const hideIdle=()=>{const e=$('#idle');if(e)e.remove()};
const act=()=>{lastAct=Date.now();hideIdle()};
['pointerdown','keydown','scroll','touchstart','input'].forEach(ev=>document.addEventListener(ev,act,{capture:true,passive:true}));
function showIdle(sec){let e=$('#idle');if(!e){e=document.createElement('div');e.id='idle';e.className='idle';e.innerHTML='<span id="idle-t"></span><button class="btn sm" data-act="stay">ابقَ مسجّلاً</button>';document.body.appendChild(e)}$('#idle-t').textContent=`سيتم تسجيل خروجك بعد ${sec} ثانية لعدم النشاط`}
function startIdle(){clearInterval(idleTimer);lastAct=Date.now();
  idleTimer=setInterval(()=>{if(!USER)return;if(live.sid){lastAct=Date.now();return}
    const idle=Date.now()-lastAct;if(idle>=IDLE_MS)logout('idle');else if(idle>=IDLE_MS-60000)showIdle(Math.ceil((IDLE_MS-idle)/1000))},1000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&USER&&!live.sid&&Date.now()-lastAct>=IDLE_MS)logout('idle')});
async function logout(reason){
  stopLive();watchCheckins(null);hideIdle();clearInterval(idleTimer);
  loginMsg=reason==='idle'?'تم تسجيل خروجك تلقائياً بعد 10 دقائق من عدم النشاط.':'';
  try{await signOut(auth)}catch(e){}
}

/* ---------- boot ---------- */
async function boot(){
  if(!configured){
    $('#app').innerHTML=`<div class="stu"><section class="card"><h2>الموقع غير مفعّل بعد</h2><p class="muted">افتح الملف <b dir="ltr">firebase-config.js</b> والصق فيه إعدادات مشروع Firebase حسب خطوات الشرح.</p></section></div>`;return;
  }
  if(isStudent){ST.step='id';ST.loadedAt=Date.now();renderStudent();sdkP=loadSDK(true);try{await sdkP}catch(e){ST.step='bad';ST.msg='تعذّر تحميل الصفحة. تحقق من الاتصال وأعد المحاولة.';renderStudent();return}initStudent();return}
  renderLogin();sdkP=loadSDK(false);
  try{await sdkP;await setPersistence(auth,browserSessionPersistence)}catch(e){console.error(e)}
  onAuthStateChanged(auth,async u=>{
    USER=u;IS_OWNER=!!(u&&u.email&&OWNER&&u.email.toLowerCase()===OWNER);
    if(!u){stopLive();watchCheckins(null);COURSES.clear();COURSE_TRASH.clear();STU.clear();S.sessions={};S.records={};CC=null;V.cid=null;V.sid=null;V.cf=null;const m=loginMsg;loginMsg='';renderLogin(m);return}
    $('#app').innerHTML='<div class="stu"><p class="muted center">جارٍ تحميل البيانات...</p></div>';
    startIdle();loadLibs();
    try{await loadAll();renderAll()}
    catch(e){console.error(e);$('#app').innerHTML='<div class="stu"><div class="err">تعذّر تحميل البيانات. تأكد أن قواعد Firestore الجديدة منشورة وأن بريدك مسجّل كمالك أو مشرف.</div><button class="theme" data-act="logout">خروج</button></div>'}
  });
}
boot();
</script>
</body>
</html>
